spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minimart}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:minimart}
    password: ${SPRING_DATASOURCE_PASSWORD:minimart}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
